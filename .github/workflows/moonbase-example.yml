name: Build and test NASA Moon Base example
on:
  push:
    branches: [main]
    paths: ['examples/moon_base*.py', '.github/workflows/moonbase-example.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: moonbase-example-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install official Blender runtime
        run: |
          python -m venv "$RUNNER_TEMP/blender"
          "$RUNNER_TEMP/blender/bin/python" -m pip install -r gazebo/requirements-blender.txt
      - name: Restore checksum-pinned elevation and photometry data
        run: python tools/fetch_release_data.py
      - name: Build Blender scene and render both cameras
        run: '"$RUNNER_TEMP/blender/bin/python" examples/moon_base.py'
      - name: Export the generated scene for Gazebo
        run: python examples/moon_base_gazebo.py build --bpy-python "$RUNNER_TEMP/blender/bin/python"
      - name: Install Mesa software rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libglu1-mesa
      - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2
        with:
          environment-file: gazebo/environment.yml
          cache-environment: false
          init-shell: none
      - name: Test Ogre2 rendering and DART collisions
        shell: micromamba-shell {0}
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          bash gazebo/tests/run_offline_tests.sh build/gazebo/moonbase
      - name: Test full Gazebo server and camera
        shell: micromamba-shell {0}
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          bash gazebo/test_server.sh build/gazebo/moonbase
      - name: Package verified Blender and Gazebo assets
        run: python examples/moon_base_gazebo.py package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moonbase-example
          path: dist/moonbase/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Retain diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moonbase-failure
          path: |
            build/moonbase/*.json
            build/gazebo/moonbase/test_output/*.log
            build/gazebo/moonbase/test_output/*.csv
            build/gazebo/moonbase/test_output/*.png
            build/gazebo/moonbase/export_manifest.json
            examples/renders/NASA_MoonBase*.png
          retention-days: 7
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: moonbase-example
          path: dist/moonbase
      - name: Publish Moon Base target-region example
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist/moonbase
          sha256sum --check SHA256SUMS
          cd ../..
          if gh release view moonbase-v1.0.0 >/dev/null 2>&1; then
            echo 'Versioned release already exists; new validation remains available in workflow artifacts.'
          else
            gh release create moonbase-v1.0.0 dist/moonbase/* \
              --title 'NASA Moon Base target region — Connecting Ridge' \
              --notes-file NASA_MOONBASE.md --target "$GITHUB_SHA" --latest=false
          fi
